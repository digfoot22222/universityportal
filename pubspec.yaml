name: university_portal_enterprise
description: Enterprise University Student Portal, AI Verification & Smart Hostel Matchmaking System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0

  # State Management & Architecture
  flutter_riverpod: ^2.6.1
  uuid: ^4.5.1
  intl: ^0.19.0

  # Security & Authentication
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Multimodal AI, Voice & Clipboard Paste
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  super_clipboard: ^0.8.24
  speech_to_text: ^7.0.0
  record: ^5.1.2

  # Virtual Tour & 360 Explorer
  panorama_viewer: ^2.0.3

  # Payments & Receipts (Remita + QR)
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
